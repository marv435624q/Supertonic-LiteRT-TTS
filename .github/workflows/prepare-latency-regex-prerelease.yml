name: Re-sign system TTS latency prerelease

on:
  push:
    branches:
      - "fix/system-tts-latency-regex-ui"

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: resign-system-tts-latency-v0140
  cancel-in-progress: true

jobs:
  resign-prerelease:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: build-tools;35.0.0

      - name: Download, sign, and replace prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.1.40-system-tts-latency-20260912
          ASSET: Supertonic-LiteRT-v0.1.40-system-tts-latency-20260912-debug.apk
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/supertonic-release.keystore"
          INPUT_APK="$RUNNER_TEMP/input.apk"
          SIGNED_APK="$RUNNER_TEMP/$ASSET"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          gh release download "$TAG" --pattern "$ASSET" --output "$INPUT_APK"

          SIGNING_ALIAS="$ANDROID_KEY_ALIAS"
          if ! keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SIGNING_ALIAS" 2>/dev/null | grep -q "Entry type: PrivateKeyEntry"; then
            SIGNING_ALIAS="$(keytool -list -v \
              -keystore "$KEYSTORE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | \
              awk -F': ' '/Alias name:/{alias=$2} /Entry type: PrivateKeyEntry/{print alias; exit}')"
          fi
          test -n "$SIGNING_ALIAS"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$SIGNING_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$INPUT_APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$SIGNED_APK"
          gh release upload "$TAG" "$SIGNED_APK" --clobber
