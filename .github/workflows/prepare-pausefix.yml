name: Prepare TTS pause improvements

on:
  push:
    branches:
      - "fix/tts-pause-pipeline-20260912"

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: prepare-tts-pausefix-20260912
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanity-check pausefix source
        run: |
          set -euxo pipefail
          test -s sdk/src/main/kotlin/audio/soniqo/speech/audio/InternalSilenceCompressor.kt
          grep -F 'Internal Silence' app/src/main/kotlin/com/supertonic/tts/MainActivity.kt
          grep -F 'Max Pause @1x (ms)' app/src/main/kotlin/com/supertonic/tts/MainActivity.kt
          grep -F 'internal_silence_removed_ms' sdk/src/main/kotlin/audio/soniqo/speech/service/SpeechTextToSpeechService.kt
          grep -F 'request.pitch' sdk/src/main/kotlin/audio/soniqo/speech/service/SpeechTextToSpeechService.kt
          grep -F 'TTS_WARM_READY' sdk/src/main/kotlin/audio/soniqo/speech/service/SpeechTextToSpeechService.kt
          grep -F 'TTS_WARM_JOIN' sdk/src/main/kotlin/audio/soniqo/speech/service/SpeechTextToSpeechService.kt
          grep -F 'builtin_whitespace_v1_seeded' sdk/src/main/kotlin/audio/soniqo/speech/rules/PronunciationRules.kt
          grep -F 'val term = if (isRegex) rawTerm else rawTerm.trim()' sdk/src/main/kotlin/audio/soniqo/speech/rules/PronunciationRules.kt
          grep -F 'supertonicPrebuiltNative' sdk/build.gradle.kts
          grep -F 'versionName = "0.1.39"' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmdline-tools;latest

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Reuse verified v0.1.38 native runtime
        env:
          BASE_APK_URL: https://github.com/marv435624q/Supertonic-LiteRT-TTS/releases/download/v0.1.38/Supertonic-LiteRT-v0.1.38-debug.apk
          BASE_APK_SHA256: 5fbcb6623b7bb733b110bdfad46e4a3e375d206c3224ec1da66f057f4e730257
        run: |
          set -euxo pipefail
          BASE_APK="$RUNNER_TEMP/Supertonic-LiteRT-v0.1.38-debug.apk"
          curl -fL --retry 3 --retry-delay 2 -o "$BASE_APK" "$BASE_APK_URL"
          echo "$BASE_APK_SHA256  $BASE_APK" | sha256sum -c -
          rm -rf sdk/src/main/jniLibs
          for abi in arm64-v8a x86_64; do
            mkdir -p "sdk/src/main/jniLibs/$abi"
            for lib in libLiteRt.so libspeech_android.so libc++_shared.so; do
              unzip -p "$BASE_APK" "lib/$abi/$lib" > "sdk/src/main/jniLibs/$abi/$lib"
              test -s "sdk/src/main/jniLibs/$abi/$lib"
            done
          done

      - name: Prepare pinned QNN runtime
        run: |
          set -euxo pipefail
          QNN_VERSION="$(sed -n 's/^qnnRuntimeVersion=//p' qnn-version.properties | tr -d '\r' | head -n1)"
          test -n "$QNN_VERSION"
          mkdir -p app/libs
          QNN_AAR="app/libs/qnn-runtime-${QNN_VERSION}.aar"
          QNN_URL="https://repo.maven.apache.org/maven2/com/qualcomm/qti/qnn-runtime/${QNN_VERSION}/qnn-runtime-${QNN_VERSION}.aar"
          curl -fL --retry 3 --retry-delay 2 -o "$QNN_AAR" "$QNN_URL"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/qnn-runtime.sha1" "${QNN_URL}.sha1"
          expected="$(tr -d '[:space:]' < "$RUNNER_TEMP/qnn-runtime.sha1")"
          actual="$(sha1sum "$QNN_AAR" | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          unzip -tqq "$QNN_AAR"

      - name: Verify CI ORT runtime
        run: |
          set -euxo pipefail
          ORT_AAR="sdk/libs/onnxruntime-android-qnn-1.28.0-hta.aar"
          test -s "$ORT_AAR"
          unzip -tqq "$ORT_AAR"
          for entry in classes.jar jni/arm64-v8a/libonnxruntime.so jni/arm64-v8a/libonnxruntime4j_jni.so; do
            unzip -Z1 "$ORT_AAR" | grep -qx "$entry"
          done

      - name: Build APK
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PsupertonicOrtRev30=true \
            -PsupertonicPrebuiltNative=true \
            --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$RUNNER_TEMP/app-debug.badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$BADGING"
          grep -F "package: name='com.supertonic.tts'" "$BADGING"
          grep -F "versionCode='47'" "$BADGING"
          grep -F "versionName='0.1.39'" "$BADGING"
          ZIPLIST="$RUNNER_TEMP/app-debug.ziplist.txt"
          unzip -Z1 "$APK" > "$ZIPLIST"
          for abi in arm64-v8a x86_64; do
            grep -Fx "lib/$abi/libLiteRt.so" "$ZIPLIST"
            grep -Fx "lib/$abi/libspeech_android.so" "$ZIPLIST"
            grep -Fx "lib/$abi/libc++_shared.so" "$ZIPLIST"
          done
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK"

      - name: Create pausefix release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.1.39-pausefix-20260912
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="Supertonic-LiteRT-${TAG}-debug.apk"
          cp "$APK" "$OUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --prerelease \
              --title "Supertonic LiteRT 0.1.39 Pause Fix" \
              --notes "TTS pause pipeline test build. Native LiteRT/JNI binaries are byte-for-byte reused from the verified v0.1.38 APK because this revision changes only Kotlin service/UI/audio post-processing code. Includes editable whitespace regex defaults, native-1.0x internal silence compression, Android pitch post-process, system TTS warm path, warm/request race hardening, and request latency diagnostics."
          fi
          gh release upload "$TAG" "$OUT" --clobber
