name: Prepare v0.1.41 FP32 and model-manager prerelease

on:
  push:
    branches:
      - "fix/model-manager-litert-fp32-release"

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: prepare-v0141-fp32-model-manager
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source revision
        run: |
          set -euxo pipefail
          grep -F 'versionCode = 49' app/build.gradle.kts
          grep -F 'versionName = "0.1.41"' app/build.gradle.kts
          grep -F 'menu.add("Manage Models")' app/src/main/kotlin/com/supertonic/tts/MainActivity.kt
          grep -F 'fun releaseActiveModel(model: TtsModel)' sdk/src/main/kotlin/audio/soniqo/speech/service/SpeechTextToSpeechService.kt
          grep -F 'supertonicPrebuiltNative' sdk/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmdline-tools;latest

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Reuse verified LiteRT native runtime
        env:
          BASE_APK_URL: https://github.com/marv435624q/Supertonic-LiteRT-TTS/releases/download/v0.1.38/Supertonic-LiteRT-v0.1.38-debug.apk
          BASE_APK_SHA256: 5fbcb6623b7bb733b110bdfad46e4a3e375d206c3224ec1da66f057f4e730257
        run: |
          set -euxo pipefail
          BASE_APK="$RUNNER_TEMP/Supertonic-LiteRT-v0.1.38-debug.apk"
          curl -fL --retry 3 --retry-delay 2 -o "$BASE_APK" "$BASE_APK_URL"
          echo "$BASE_APK_SHA256  $BASE_APK" | sha256sum -c -
          rm -rf sdk/src/main/jniLibs
          for abi in arm64-v8a x86_64; do
            mkdir -p "sdk/src/main/jniLibs/$abi"
            for lib in libLiteRt.so libspeech_android.so libc++_shared.so; do
              unzip -p "$BASE_APK" "lib/$abi/$lib" > "sdk/src/main/jniLibs/$abi/$lib"
              test -s "sdk/src/main/jniLibs/$abi/$lib"
            done
          done

      - name: Prepare pinned QNN runtime
        run: |
          set -euxo pipefail
          QNN_VERSION="$(sed -n 's/^qnnRuntimeVersion=//p' qnn-version.properties | tr -d '\r' | head -n1)"
          test -n "$QNN_VERSION"
          mkdir -p app/libs
          QNN_AAR="app/libs/qnn-runtime-${QNN_VERSION}.aar"
          QNN_URL="https://repo.maven.apache.org/maven2/com/qualcomm/qti/qnn-runtime/${QNN_VERSION}/qnn-runtime-${QNN_VERSION}.aar"
          curl -fL --retry 3 --retry-delay 2 -o "$QNN_AAR" "$QNN_URL"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/qnn-runtime.sha1" "${QNN_URL}.sha1"
          expected="$(tr -d '[:space:]' < "$RUNNER_TEMP/qnn-runtime.sha1")"
          actual="$(sha1sum "$QNN_AAR" | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          unzip -tqq "$QNN_AAR"

      - name: Verify CI ORT runtime
        run: |
          set -euxo pipefail
          ORT_AAR="sdk/libs/onnxruntime-android-qnn-1.28.0-hta.aar"
          test -s "$ORT_AAR"
          unzip -tqq "$ORT_AAR"
          for entry in classes.jar jni/arm64-v8a/libonnxruntime.so jni/arm64-v8a/libonnxruntime4j_jni.so; do
            unzip -Z1 "$ORT_AAR" | grep -qx "$entry"
          done

      - name: Build APK
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PsupertonicOrtRev30=true \
            -PsupertonicPrebuiltNative=true \
            --no-daemon --stacktrace

      - name: Sign APK with repository release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/supertonic-release.keystore"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIGNED_APK="$RUNNER_TEMP/app-release-key-signed.apk"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          SIGNING_ALIAS="$ANDROID_KEY_ALIAS"
          if ! keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SIGNING_ALIAS" 2>/dev/null | grep -q "Entry type: PrivateKeyEntry"; then
            SIGNING_ALIAS="$(keytool -list -v \
              -keystore "$KEYSTORE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | \
              awk -F': ' '/Alias name:/{alias=$2} /Entry type: PrivateKeyEntry/{print alias; exit}')"
          fi
          test -n "$SIGNING_ALIAS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$SIGNING_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"
          mv "$SIGNED_APK" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$RUNNER_TEMP/app-debug.badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$BADGING"
          grep -F "package: name='com.supertonic.tts'" "$BADGING"
          grep -F "versionCode='49'" "$BADGING"
          grep -F "versionName='0.1.41'" "$BADGING"
          ZIPLIST="$RUNNER_TEMP/app-debug.ziplist.txt"
          unzip -Z1 "$APK" > "$ZIPLIST"
          for abi in arm64-v8a x86_64; do
            for lib in libLiteRt.so libspeech_android.so libc++_shared.so; do
              grep -Fx "lib/$abi/$lib" "$ZIPLIST"
              unzip -p "$APK" "lib/$abi/$lib" > "$RUNNER_TEMP/apk-$abi-$lib"
              cmp "sdk/src/main/jniLibs/$abi/$lib" "$RUNNER_TEMP/apk-$abi-$lib"
            done
          done
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK"

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.1.41-model-manager-fp32-20260912
          RELEASE_TARGET: 57c9440db05ce95cf9d536fc4593ac32cbd36ea1
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="Supertonic-LiteRT-${TAG}-debug.apk"
          cp "$APK" "$OUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
          else
            gh release create "$TAG" \
              --target "$RELEASE_TARGET" \
              --prerelease \
              --title "Supertonic LiteRT v0.1.41 FP32 fix + Model Manager" \
              --notes "Restores the verified v0.1.39 LiteRT native runtime to fix the FP32 preload/synthesis regression. Adds per-model installed-size display and selective deletion while preserving other models and imported custom voices. Signed with the repository release key."
            gh release upload "$TAG" "$OUT"
          fi
