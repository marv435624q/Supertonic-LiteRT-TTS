name: Build and Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmake;3.22.1
            ndk;29.0.14206865

      - name: Prepare LiteRT and QNN runtimes
        run: |
          chmod +x setup.sh
          bash setup.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/Supertonic-LiteRT-${GITHUB_REF_NAME}-debug.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/Supertonic-LiteRT-${GITHUB_REF_NAME}-debug.apk"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            echo "Creating Release ${GITHUB_REF_NAME}..."
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "Supertonic LiteRT ${GITHUB_REF_NAME}"
          fi

          echo "Uploading APK..."
          gh release upload "${GITHUB_REF_NAME}" \
            "$APK" \
            --clobber
